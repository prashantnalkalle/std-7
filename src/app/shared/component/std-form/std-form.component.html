<div class="card">
    <div class="card-body">
        <form #stdform="ngForm" (ngSubmit)="onAdd()">
            <div class="form-group">
                <label for="name" class="font-weight-bold">Full Name*</label>
                <input 
                type="text"
                ngModel
                name="name"
                required
                class="form-control"
                >
            </div>
             <div class="form-group">
                <label for="age" class="font-weight-bold">Age*</label>
                <input 
                type="number"
                ngModel
                name="age"
                required
                class="form-control"
                >
            </div>
            <div class="form-group">
                <label for="mobile" class="font-weight-bold">Contact*</label>
                <input 
                type="number"
                ngModel
                name="mobile"
                required
                class="form-control"
                >
            </div>
             <div class="form-group">
                <label for="course" class="font-weight-bold">Course Name*</label>
                <input 
                type="text"
                ngModel
                name="course"
                required
                class="form-control"
                >
            </div>
            <button 
                *ngIf="!iseditmode"
            mat-raised-button
            color="primary"
            class="btn-block">
            Add Student    
            </button>
            <button 
                *ngIf="iseditmode"
                mat-raised-button
                color="warn"
                class="btn-block"
                (click)="onUpdate()">
                Update Student    
            </button>
        </form>
    </div>
</div>
